name: Validate skills and notify sync

# Validates the skill catalog, then (only on main, only if validation passes)
# triggers the volcano-agentic-plugins submodule sync immediately instead of
# waiting for its daily cron (.github/workflows/sync-skills.yml there). The
# notify job fires a repository_dispatch event, which that workflow's on: block
# listens for. Gating notify on validate is the whole point: a broken catalog
# must never be propagated downstream before the check that would catch it runs.
#
# Uses repository_dispatch (not workflow_dispatch) deliberately: it only
# needs Contents: write on the target repo, vs. Actions: write for
# workflow_dispatch — matching the Contents+Pull-requests-only permission
# set already used for Release Please on volcano-cli.
#
# Authenticates as the "Kong Volcano - app" GitHub App (VOLCANO_APP_ID +
# VOLCANO_APP_KEY), scoped to only the target repo.

on:
  pull_request:
  push:
    branches:
      - main

# No ambient GITHUB_TOKEN use in this job (auth is entirely via the
# App-minted token below), so drop its default scopes.
permissions: {}

# Collapse a burst of runs on the same ref into one; cancelling a superseded
# run is safe here since the newer run's notify job will dispatch anyway.
# Scoped by ref so a PR run never cancels an in-flight main run's dispatch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Only contents:read, for checkout; no ambient write scope.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate skill catalog
        run: node scripts/check-skills.mjs

  notify:
    # Gate: dispatch only after validate clears, and only on main. On PRs the
    # catalog is validated but nothing is propagated (notify is skipped).
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Generate token for volcano-agentic-plugins
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.VOLCANO_APP_ID }}
          private-key: ${{ secrets.VOLCANO_APP_KEY }}
          owner: Kong
          repositories: volcano-agentic-plugins
          # Without an explicit permission-* input, the minted token inherits
          # every permission the App installation holds on the target repo,
          # not just what this workflow needs. Scope it down explicitly.
          permission-contents: write

      - name: Dispatch sync-skills.yml in volcano-agentic-plugins
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Retry transient GitHub API failures (e.g. a bare HTTP 500 on the
          # dispatches endpoint) with exponential backoff. Without this, a blip
          # here silently drops the trigger and the sync only happens at the
          # consumer's daily cron — and the consumer's own PR-create retry
          # never even runs. Firing the dispatch more than once is safe: the
          # sync workflow is idempotent and no-ops when already in sync. On
          # persistent failure we exit non-zero so the run goes red.
          n=1; max=5; delay=10
          until gh api repos/Kong/volcano-agentic-plugins/dispatches \
                  --method POST \
                  -f event_type=volcano-skills-updated; do
            if [ "$n" -ge "$max" ]; then
              echo "::error::dispatch still failing after $max attempts" >&2
              exit 1
            fi
            echo "dispatch attempt $n/$max failed; retrying in ${delay}s" >&2
            sleep "$delay"; n=$((n + 1)); delay=$((delay * 2))
          done
